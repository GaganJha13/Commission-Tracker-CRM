name: keep-render-awake

# Runs on a schedule (cron) — runs every 12 minutes
on:
  schedule:
    - cron: '*/12 * * * *'   # every 12 minutes (UTC)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          # replace with your Render URL:
          URL="https://your-app.onrender.com/health"

          # Try up to 3 times, exit 0 if HTTP 200/301/302
          for i in 1 2 3; do
            echo "Attempt $i: pinging $URL ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL" || true)
            echo "HTTP status: $status"
            if [ "$status" = "200" ] || [ "$status" = "301" ] || [ "$status" = "302" ]; then
              echo "OK — service is awake."
              exit 0
            fi
            sleep 5
          done
          echo "Ping failed after 3 attempts."
          exit 1
