<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .login-container {
            width: 100%;
            max-width: clamp(320px, 90vw, 440px);
            background: #212021;
            border-radius: clamp(16px, 3vw, 24px);
            padding: clamp(2rem, 5vw, 3rem);
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.03),
                        0 0 0 1px rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: clamp(2rem, 5vw, 2.5rem);
        }

        .login-header h1 {
            color: #ffffff;
            font-size: clamp(1.75rem, 5vw, 2.25rem);
            font-weight: 700;
            margin-bottom: clamp(0.5rem, 2vw, 0.75rem);
        }

        .login-header p {
            color: #888888;
            font-size: clamp(0.875rem, 2.5vw, 1rem);
        }

        .form-group {
            margin-bottom: clamp(1.25rem, 4vw, 1.5rem);
            position: relative;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            font-size: clamp(0.875rem, 2.5vw, 0.95rem);
            font-weight: 500;
            margin-bottom: clamp(0.5rem, 2vw, 0.625rem);
        }

        .password-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: clamp(0.875rem, 3vw, 1rem);
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: clamp(8px, 2vw, 12px);
            color: #ffffff;
            font-size: clamp(0.9375rem, 2.5vw, 1rem);
            transition: all 0.3s ease;
            outline: none;
        }

        .password-wrapper input {
            padding-right: clamp(3rem, 10vw, 3.5rem);
        }

        .form-group input::placeholder {
            color: #4a4a4a;
        }

        .form-group input:focus {
            background: #1a1a1a;
            border-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: clamp(0.875rem, 3vw, 1.125rem);
            background: #ffffff;
            border: none;
            border-radius: clamp(8px, 2vw, 12px);
            color: #000000;
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: clamp(0.5rem, 2vw, 1rem);
        }

        .login-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

                .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #ff5555;
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Please login to your account</p>
        </div>
        
        <form id="loginForm" method="POST" action="/">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your.email@example.com" 
                    required
                >
            </div>         
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>
            </div> 
            
                    {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
            <button type="submit" class="login-btn">Login</button>
        </form>        
    </div>
</body>
</html>
