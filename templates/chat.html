<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(0.5rem, 2vw, 1rem);
        }

        .chat-container {
            width: 100%;
            max-width: clamp(350px, 95vw, 900px);
            height: clamp(500px, 90vh, 700px);
            background: #0a0a0a;
            border-radius: clamp(12px, 2vw, 20px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.05),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background: #141414;
            padding: clamp(1rem, 3vw, 1.5rem);
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            color: #ffffff;
            font-size: clamp(1.25rem, 4vw, 1.5rem);
            font-weight: 600;
        }

        .header-content p {
            color: #888888;
            font-size: clamp(0.75rem, 2vw, 0.875rem);
            margin-top: clamp(0.25rem, 1vw, 0.375rem);
        }

        .logout-button {
            padding: clamp(0.5rem, 2vw, 0.625rem) clamp(1rem, 3vw, 1.25rem);
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: clamp(6px, 1.5vw, 8px);
            color: #ffffff;
            font-size: clamp(0.75rem, 2vw, 0.875rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-button:hover {
            background: #3a3a3a;
            border-color: #4a4a4a;
            transform: translateY(-1px);
        }

        .logout-button:active {
            transform: translateY(0);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: clamp(1rem, 3vw, 1.5rem);
            display: flex;
            flex-direction: column;
            gap: clamp(0.75rem, 2vw, 1rem);
            margin-bottom: clamp(1rem, 3vw, 1.5rem);
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        .message {
            display: flex;
            gap: clamp(0.5rem, 2vw, 0.75rem);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: clamp(2rem, 6vw, 2.5rem);
            height: clamp(2rem, 6vw, 2.5rem);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.875rem, 2.5vw, 1rem);
            font-weight: 600;
            flex-shrink: 0;
        }

        .bot-avatar {
            background: #ffffff;
            color: #000000;
        }

        .user-avatar {
            background: #2a2a2a;
            color: #ffffff;
        }

        .message-content {
            max-width: 70%;
            padding: clamp(0.75rem, 2.5vw, 1rem);
            border-radius: clamp(12px, 2vw, 16px);
            font-size: clamp(0.875rem, 2.5vw, 0.9375rem);
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .bot .message-content {
            background: #141414;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            white-space: pre-wrap;
            
        }

        .user .message-content {
            background: #ffffff;
            color: #000000;
        }

        .chat-input-container {
            padding: clamp(1rem, 3vw, 1.5rem);
            padding-top: clamp(1.5rem, 4vw, 2rem);
            border-top: 1px solid #2a2a2a;
            background: #0a0a0a;
            margin-top: auto;
        }

        .chat-input-wrapper {
            display: flex;
            gap: clamp(0.5rem, 2vw, 0.75rem);
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: clamp(0.75rem, 2.5vw, 1rem);
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: clamp(10px, 2vw, 12px);
            color: #ffffff;
            font-size: clamp(0.875rem, 2.5vw, 0.9375rem);
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
            resize: none;
            min-height: clamp(2.5rem, 8vw, 3rem);
            max-height: clamp(6rem, 20vw, 8rem);
        }

        .chat-input::placeholder {
            color: #4a4a4a;
        }

        .chat-input:focus {
            background: #1a1a1a;
            border-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .send-button {
            padding: clamp(0.75rem, 2.5vw, 1rem);
            background: #ffffff;
            border: none;
            border-radius: clamp(10px, 2vw, 12px);
            color: #000000;
            font-size: clamp(0.875rem, 2.5vw, 1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: clamp(3.5rem, 15vw, 5rem);
            flex-shrink: 0;
        }

        .send-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            background: #2a2a2a;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: clamp(0.75rem, 2.5vw, 1rem);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #888888;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #4a4a4a;
            text-align: center;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .empty-state-icon {
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: clamp(0.5rem, 2vw, 1rem);
        }

        .empty-state p {
            font-size: clamp(0.875rem, 2.5vw, 1rem);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <h1>Chat Bot</h1>
                <p>Ask me anything!</p>
            </div>
            <form id="loginForm" method="POST" action="/logout">
            <button class="logout-button">Logout</button>
            </form>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <p>Start a conversation by typing a message below</p>
            </div>
        </div>

        <div class="chat-input-container">
            <form class="chat-input-wrapper" id="chatForm">
                <textarea 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button type="submit" class="send-button" id="sendButton">Send</button>
            </form>
        </div>
    </div>
<script>
const chatMessages = document.getElementById('chatMessages');
const messageInput = document.getElementById('messageInput');
const chatForm = document.getElementById('chatForm');
const sendButton = document.getElementById('sendButton');

// Load saved messages
let messages = JSON.parse(localStorage.getItem('chatMessages')) || [];

// Display saved messages
if (messages.length > 0) {
    chatMessages.innerHTML = '';
    messages.forEach(msg => displayMessage(msg.text, msg.isUser, false));
} else {
    chatMessages.innerHTML = '';
    displayMessage('Hello, I am Brand Metrics chatbot! What can I do for you?', false, true);
}

function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
}


// Auto-resize textarea
messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

// ===== MAIN SUBMIT HANDLER (only one) =====
chatForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    const message = messageInput.value.trim();
    if (!message) return;

    if (chatMessages.querySelector('.empty-state')) {
        chatMessages.innerHTML = '';
    }

    displayMessage(message, true);
    saveMessage(message, true);

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendButton.disabled = true;
    showTypingIndicator();

    try {
        const resp = await fetch('/api/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ text: message })
        });
        const data = await resp.json();
        hideTypingIndicator();
        sendButton.disabled = false;

        if (data && data.ok) {
            displayMessage(data.text, false);
            saveMessage(data.text, false);
        } else {
            const err = (data && data.text) ? data.text : 'Server error';
            displayMessage('Error: ' + err, false);
        }
    } catch (err) {
        hideTypingIndicator();
        sendButton.disabled = false;
        displayMessage('Network error: ' + err.message, false);
    }
});

// ===== Utilities =====
function displayMessage(text, isUser, scroll = true) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

    const avatar = document.createElement('div');
    avatar.className = `message-avatar ${isUser ? 'user-avatar' : 'bot-avatar'}`;
    avatar.textContent = isUser ? 'U' : 'B';

    const content = document.createElement('div');
    content.className = 'message-content';
    content.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

    if (isUser) {
        messageDiv.appendChild(content);
        messageDiv.appendChild(avatar);
    } else {
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
    }

    chatMessages.appendChild(messageDiv);
    if (scroll) chatMessages.scrollTop = chatMessages.scrollHeight;
}

function saveMessage(text, isUser) {
    messages.push({ text, isUser });
    localStorage.setItem('chatMessages', JSON.stringify(messages));
}

function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar bot-avatar';
    avatar.textContent = 'B';

    const content = document.createElement('div');
    content.className = 'message-content';
    content.innerHTML =
        '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

    typingDiv.appendChild(avatar);
    typingDiv.appendChild(content);
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function hideTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

// Enter to send, Shift+Enter for new line
messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
    }
});
</script>

</body>
</html>
